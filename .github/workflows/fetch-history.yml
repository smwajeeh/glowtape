name: Fetch price history (Wyckoff Lab)

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "Comma-separated symbols"
        default: "QQQ,GOOG,ADBE"
  push:
    branches: [main]
    paths: ["lab/history-request.txt"]

permissions:
  contents: write

concurrency:
  group: history
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Download bars from Alpaca
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          SYMBOLS: ${{ github.event.inputs.symbols }}
        run: |
          S="${SYMBOLS:-$(tr -d ' \n' < lab/history-request.txt)}"
          node scripts/history.mjs out/history "$S"
      - name: Publish to the history branch
        run: |
          git fetch --depth=1 origin history || true
          mkdir -p hist && cd hist && git init -q -b history
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          (git fetch -q --depth=1 origin history && git checkout -q -f FETCH_HEAD -B history) || true
          cp ../out/history/*.json .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "History $(date -u +%Y-%m-%dT%H:%MZ)" && git push -q origin history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
