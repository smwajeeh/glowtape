name: Update market data

on:
  schedule:
    # Backup starters through the trading day (UTC). Each run keeps updating every 5 minutes
    # until the close, so only one of these needs to fire. Extra ones wait in line and exit
    # quickly if the market is closed.
    - cron: "25 13 * * 1-5"
    - cron: "40 13 * * 1-5"
    - cron: "*/20 14-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Keep prices fresh until the close
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/market-loop.sh
