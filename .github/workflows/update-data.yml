name: Update market data

on:
  schedule:
    # Every 5 minutes, Monday–Friday, 13:00–21:59 UTC (covers 9:30 AM–4:00 PM New York time in summer and winter).
    # GitHub can start scheduled runs a few minutes late when it is busy.
    - cron: "*/5 13-21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get the last published data
        run: git fetch --depth=1 origin data && git show origin/data:data.json > prev.json || echo "no previous data yet"

      - name: Fetch prices from Alpaca
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: node scripts/update.mjs out/data.json prev.json

      - name: Publish to the data branch
        run: |
          if [ ! -f out/data.json ]; then echo "Nothing to publish."; exit 0; fi
          if [ -f prev.json ] && cmp -s out/data.json prev.json; then echo "Data unchanged."; exit 0; fi
          cd out
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -qm "Market data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
